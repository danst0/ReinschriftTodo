---

services:
  webapp:
    image: ghcr.io/danst0/reinschrift-web:latest
    # Or build locally instead:
    # build: .
    ports:
      - "5000:5000"
    volumes:
      # The file must exist before the first start (touch ../TodosDatenbank.md)
      - ../TodosDatenbank.md:/data/TodosDatenbank.md
      - todo_config:/config
    environment:
      - TODOS_DB_PATH=/data/TodosDatenbank.md
      # Signs sessions; set a long random value, e.g. python3 -c 'import secrets; print(secrets.token_hex(32))'
      - SECRET_KEY=change-me
      - CONFIG_PATH=/config/settings.json
      - APP_USER=admin
      - APP_PASSWORD=secret
      # Due dates in the todo file are local time; reminders need to know which
      - TZ=Europe/Berlin

      # Push reminders (Optional; on by default, VAPID key is kept in /config)
      # - PUSH_LEAD_MINUTES=15
      # - PUSH_ALL_DAY_TIME=08:00
      # - VAPID_SUBJECT=mailto:you@example.com

      # OIDC Configuration (Optional)
      - OIDC_ISSUER=https://your-oidc-provider.com/.well-known/openid-configuration
      - OIDC_CLIENT_ID=your-client-id
      - OIDC_CLIENT_SECRET=your-client-secret
      - OIDC_ALLOWED_USER=user@example.com
      - OIDC_REDIRECT_URI=https://your-public-domain/authorize

      # WebDAV Configuration (Optional)
      - USE_WEBDAV=false
      - WEBDAV_URL=https://your-nextcloud-instance.com/remote.php/dav/files/username/path/to/TodosDatenbank.md
      - WEBDAV_USERNAME=your_username
      - WEBDAV_PASSWORD=your_password

      # CalDAV Server (iOS Reminders sync, Optional)
      # - CALDAV_ENABLED=true
      # - CALDAV_USER=caldavuser
      # - CALDAV_PASSWORD=caldavsecret

volumes:
  todo_config: