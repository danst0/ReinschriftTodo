{% extends 'base.html' %}

{% block title %}{{ t.todos if t else 'Reinschrift' }}{% endblock %}

{% block content %}
<main>
    <header class="page-header">
        <h1>{{ t.todos if t else 'Reinschrift' }}</h1>
    </header>
    <p class="error-message" role="alert">{{ error }}</p>
    <a href="{{ url_for('main.index') }}" class="btn-primary">{{ t.get('cancel', 'Back') if t else 'Back' }}</a>
</main>
{% endblock %}
