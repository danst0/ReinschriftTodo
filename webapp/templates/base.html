<!DOCTYPE html>
<html lang="{{ current_lang or 'en' }}">
<head>
    <meta charset="utf-8">
    <title>{% block title %}{{ t.todos }}{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Reinschrift">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-180.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="preload" href="{{ url_for('static', filename='fonts/hanken-grotesk-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=app_version) }}">
    {% block head %}{% endblock %}
</head>
<body{% block body_attrs %}{% endblock %}>
    {% block content %}{% endblock %}

    {% block scripts %}{% endblock %}

    <!-- Service Worker Registration (PWA) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registered:', registration.scope);
                        // Scope is /static/, which no page navigates to, so the
                        // browser would never look for a new worker by itself.
                        return registration.update();
                    })
                    .catch(error => {
                        console.log('ServiceWorker registration failed:', error);
                    });
            });
        }
    </script>
</body>
</html>
