<!DOCTYPE html>
<html>
<head>
    <title>{{ t.edit_todo }}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 1rem; background-color: #fafafa; color: #333; }
        
        @media screen and (max-width: 600px) {
            body { padding-bottom: 10rem; }
        }
        
        h2 { color: #333; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 500; }
        input[type="text"], input[type="date"], input[type="datetime-local"], textarea { width: 100%; padding: 0.8rem; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        input[type="checkbox"] { transform: scale(1.5); margin-right: 0.5rem; }
        .buttons { display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap; }
        button { padding: 0.8rem 1.5rem; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        .btn-primary { background: #3584e4; color: white; }
        .btn-secondary { background: #e0e0e0; color: #333; }
        .btn-action { background: #f6f5f4; border: 1px solid #ddd; color: #333; }
        
        @media (prefers-color-scheme: dark) {
            body { background-color: #1e1e1e; color: #e0e0e0; }
            h2 { color: #e0e0e0; }
            input[type="text"], input[type="date"], input[type="datetime-local"], textarea { background: #2d2d2d; border-color: #444; color: #e0e0e0; }
            .btn-secondary { background: #3d3d3d; color: #e0e0e0; }
            .btn-action { background: #2d2d2d; border-color: #444; color: #e0e0e0; }
        }
    </style>
    <script>
        function timePart(inputEl) {
            if (!inputEl) return '00:00';
            const raw = inputEl.value || '';
            if (raw.includes('T')) {
                const maybeTime = raw.split('T')[1].slice(0, 5);
                return maybeTime || '00:00';
            }
            return '00:00';
        }

        function setDate(offset) {
            const dateInput = document.getElementById('due');
            if (!dateInput) return;
            const now = new Date();
            let targetDate = new Date();
            let targetTime;
            
            if (offset === 0) {
                // Smart "Today" logic: at least 4 hours from now
                const currentHour = now.getHours();
                if (currentHour < 8) {
                    targetTime = '12:00';
                } else if (currentHour < 14) {
                    targetTime = '18:00';
                } else {
                    targetTime = '18:00';
                }
            } else {
                targetDate.setDate(now.getDate() + offset);
                targetTime = '12:00';
            }
            
            const yyyy = targetDate.getFullYear();
            const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
            const dd = String(targetDate.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}T${targetTime}`;
        }

        function setNextWeekend() {
            const dateInput = document.getElementById('due');
            if (!dateInput) return;
            const now = new Date();
            const dayOfWeek = now.getDay(); // 0 = Sunday, 6 = Saturday
            let daysUntilSaturday;
            
            if (dayOfWeek === 6) {
                // Today is Saturday, go to next Saturday
                daysUntilSaturday = 7;
            } else if (dayOfWeek === 0) {
                // Today is Sunday, go to next Saturday (6 days)
                daysUntilSaturday = 6;
            } else {
                // Monday-Friday: days until this Saturday
                daysUntilSaturday = 6 - dayOfWeek;
            }
            
            const targetDate = new Date(now);
            targetDate.setDate(now.getDate() + daysUntilSaturday);
            
            const yyyy = targetDate.getFullYear();
            const mm = String(targetDate.getMonth() + 1).padStart(2, '0');
            const dd = String(targetDate.getDate()).padStart(2, '0');
            dateInput.value = `${yyyy}-${mm}-${dd}T12:00`;
        }

        function setSometime() {
            const dateInput = document.getElementById('due');
            if (!dateInput) return;
            dateInput.value = `9999-12-31T00:00`;
        }

        function focusRelative(form, current, backwards) {
            const focusables = Array.from(form.querySelectorAll('input, select, textarea, button'));
            const idx = focusables.indexOf(current);
            if (idx === -1) return;
            const nextIdx = backwards ? idx - 1 : idx + 1;
            if (nextIdx >= 0 && nextIdx < focusables.length) {
                focusables[nextIdx].focus();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const noteField = document.getElementById('note');
            const form = document.querySelector('form');
            if (!noteField || !form) return;

            noteField.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    focusRelative(form, e.target, e.shiftKey);
                } else if ((e.key === 'Enter' || e.key === 'NumpadEnter') && e.ctrlKey) {
                    e.preventDefault();
                    form.dispatchEvent(new Event('submit', { cancelable: true, bubbles: true }));
                }
            });
        });
    </script>
</head>
<body>
    <h2>{{ t.edit_todo }}</h2>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label for="title">{{ t.title }}</label>
            <input type="text" id="title" name="title" value="{{ todo.title }}" required>
        </div>
        <div class="form-group">
            <label for="projects">{{ t.project }}</label>
            <input type="text" id="projects" name="projects" value="{% if todo.projects %}{% for p in todo.projects %}+{{ p }}{% if not loop.last %} {% endif %}{% endfor %}{% endif %}">
        </div>
        <div class="form-group">
            <label for="contexts">{{ t.context }}</label>
            <input type="text" id="contexts" name="contexts" value="{% if todo.contexts %}{% for c in todo.contexts %}@{{ c }}{% if not loop.last %} {% endif %}{% endfor %}{% endif %}">
        </div>
        <div class="form-group">
            <label for="note">{{ t.note }}</label>
            <textarea id="note" name="note" rows="4" placeholder="{{ t.note }}">{{ todo.note or '' }}</textarea>
        </div>
        <div class="form-group">
            <label for="due">{{ t.due_date }}</label>
            <div style="display: flex; gap: 0.5rem;">
                <input type="datetime-local" id="due" name="due" value="{{ todo.due_input or '' }}">
                <button type="button" class="btn-action" onclick="setDate(0)" title="{{ t.today }}">📅</button>
                <button type="button" class="btn-action" onclick="setDate(1)" title="{{ t.tomorrow }}">➡️</button>
                <button type="button" class="btn-action" onclick="setNextWeekend()" title="{{ t.next_weekend }}">🏖️</button>
                <button type="button" class="btn-action" onclick="setSometime()" title="{{ t.sometime }}">🕒</button>
            </div>
        </div>
        <div class="form-group">
            <label for="reference">{{ t.reference }}</label>
            <input type="text" id="reference" name="reference" value="{{ todo.reference or '' }}">
        </div>
        <div class="form-group" id="comment-group" style="display: none;">
            <label for="comment">{{ t.comment }}</label>
            <input type="text" id="comment" name="comment" placeholder="{{ t.comment }}">
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" id="done-checkbox" name="done" {% if todo.done %}checked{% endif %}>
                {{ t.done }}
            </label>
        </div>
        
        <div class="buttons">
            <button type="submit" class="btn-primary">{{ t.save }}</button>
            <button type="button" class="btn-action" id="close-with-comment-btn" onclick="showCommentField()" {% if todo.done %}style="display: none;"{% endif %}>{{ t.close_with_comment }}</button>
            <button type="button" class="btn-action" style="color: #e01b24;" onclick="if(confirm('{{ t.delete }}?')) document.getElementById('delete-form').submit();" title="{{ t.delete }}">🗑️</button>
            <a href="{{ url_for('index') }}" class="btn-secondary" style="text-decoration: none; display: inline-block; text-align: center;">{{ t.cancel }}</a>
        </div>
    </form>

    <form id="delete-form" action="{{ url_for('delete', line_index=todo.line_index) }}" method="post" style="display: none;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    </form>

    <script>
        function showCommentField() {
            document.getElementById('comment-group').style.display = 'block';
            document.getElementById('done-checkbox').checked = true;
            document.getElementById('close-with-comment-btn').style.display = 'none';
            const commentInput = document.getElementById('comment');
            commentInput.focus();
            setTimeout(() => {
                commentInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 300);
        }

        document.querySelector('form').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                e.preventDefault();
                this.requestSubmit();
            }
        });
    </script>
</body>
</html>
