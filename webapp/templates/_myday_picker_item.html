{% from '_icons.html' import icon %}
{% from '_todo_meta.html' import todo_meta %}
{% set dv = due_view(todo) %}
<div class="myday-picker-item" data-marker="{{ todo.marker or '' }}">
    <button type="button" class="myday-add-btn" onclick="addToMyDay(event, '{{ todo.marker or '' }}')"
            title="{{ t.add_to_my_day }}" aria-label="{{ t.add_to_my_day }}: {{ todo.title }}">{{ icon('plus', size=18) }}</button>
    <div class="content" onclick="openEditModal({{ todo.line_index }})">
        <span class="title">{{ todo.title }}</span>{{ todo_meta(todo, t, dv) }}
    </div>
</div>
