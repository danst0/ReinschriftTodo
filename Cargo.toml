[workspace]
members = ["core", "gui", "cli"]
resolver = "3"

[workspace.package]
version = "0.18.0"
edition = "2024"
license = "CC-BY-SA-4.0"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
